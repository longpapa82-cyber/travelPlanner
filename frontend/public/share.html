<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myTravel — 여행 공유</title>

  <!-- OG 기본값 (크롤러용) -->
  <meta property="og:title" content="myTravel — 여행 일정 공유">
  <meta property="og:description" content="AI로 만든 여행 일정을 확인해보세요.">
  <meta property="og:image" content="https://mytravel-planner.com/assets/icon-512-v2.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="myTravel">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4A90D9;
      --primary-dark: #2d6aaf;
      --text: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --radius: 16px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* 앱 배너 */
    #app-banner {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #app-banner img { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; }
    #banner-info { flex: 1; min-width: 0; }
    #banner-info .app-name { font-size: 15px; font-weight: 700; }
    #banner-info .app-desc { font-size: 12px; color: var(--text-sub); margin-top: 1px; }
    #banner-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
    }
    #banner-btn:hover { background: var(--primary-dark); }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    /* 로딩 */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      gap: 16px;
      color: var(--text-sub);
      font-size: 15px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 에러 */
    #error-box {
      display: none;
      text-align: center;
      padding: 80px 24px;
    }
    #error-box .error-icon { font-size: 48px; margin-bottom: 16px; }
    #error-box h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    #error-box p { font-size: 15px; color: var(--text-sub); line-height: 1.6; }

    /* 여행 히어로 */
    #trip-content { display: none; }
    .hero {
      background: linear-gradient(135deg, #1a3a5c 0%, #2d6aaf 100%);
      border-radius: var(--radius);
      padding: 28px 24px;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 4px 24px rgba(15,23,42,0.12);
    }
    .shared-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .destination { font-size: 30px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; }
    .country { font-size: 16px; opacity: 0.8; margin-bottom: 14px; }
    .date-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 20px;
    }
    .stats-row { display: flex; gap: 28px; }
    .stat { text-align: center; }
    .stat-value { font-size: 24px; font-weight: 700; }
    .stat-label { font-size: 12px; opacity: 0.75; margin-top: 2px; }

    /* 섹션 카드 */
    .section-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(15,23,42,0.06);
    }
    .section-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
    .description { font-size: 15px; line-height: 1.65; color: var(--text-sub); }

    /* 일정 */
    .day-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .day-title { font-size: 16px; font-weight: 700; }
    .day-date { font-size: 13px; color: var(--text-sub); }
    .activity-item {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-top: 1px solid var(--border);
    }
    .activity-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--primary);
      margin-top: 7px;
      flex-shrink: 0;
    }
    .activity-time { font-size: 13px; font-weight: 600; color: var(--primary); }
    .activity-title { font-size: 15px; font-weight: 600; margin-top: 2px; }
    .activity-location {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 3px;
    }
    .no-activities { font-size: 14px; color: var(--text-sub); font-style: italic; }

    /* 하단 CTA */
    #bottom-cta {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #bottom-cta .cta-text { font-size: 13px; color: var(--text-sub); }
    #cta-btn {
      display: block;
      width: 100%;
      max-width: 400px;
      background: var(--primary);
      color: #fff;
      text-align: center;
      text-decoration: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
    }
    #cta-btn:hover { background: var(--primary-dark); }

    .footer {
      text-align: center;
      padding: 24px 0 8px;
      font-size: 13px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <!-- 상단 앱 배너 -->
  <div id="app-banner">
    <img src="/assets/icon-192-v2.png" alt="myTravel">
    <div id="banner-info">
      <div class="app-name">myTravel</div>
      <div class="app-desc">AI 여행 플래너</div>
    </div>
    <a id="banner-btn" href="#" target="_blank" rel="noopener noreferrer">앱 받기</a>
  </div>

  <div class="container">
    <div id="loading">
      <div class="spinner"></div>
      <span>여행 정보를 불러오는 중...</span>
    </div>

    <div id="error-box">
      <div class="error-icon">🔗</div>
      <h2 id="error-title">링크를 찾을 수 없습니다</h2>
      <p id="error-msg">공유 링크가 만료되었거나 삭제되었습니다.</p>
    </div>

    <div id="trip-content">
      <div class="hero">
        <div class="shared-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          공유된 여행
        </div>
        <div class="destination" id="trip-destination"></div>
        <div class="country" id="trip-country"></div>
        <div class="date-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="trip-dates"></span>
        </div>
        <div class="stats-row" id="trip-stats"></div>
      </div>

      <div class="section-card" id="description-section" style="display:none">
        <div class="section-title">이 여행에 대해</div>
        <div class="description" id="trip-description"></div>
      </div>

      <div class="section-card" id="itinerary-section" style="display:none">
        <div class="section-title">여행 일정</div>
        <div id="itinerary-list"></div>
      </div>

      <div class="footer">Shared via myTravel</div>
    </div>
  </div>

  <div id="bottom-cta">
    <div class="cta-text">myTravel 앱에서 나만의 여행을 만들어보세요</div>
    <a id="cta-btn" href="#" target="_blank" rel="noopener noreferrer">앱 다운로드</a>
  </div>

  <script>
    (function () {
      'use strict';

      var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.longpapa82.travelplanner';
      var APP_STORE  = 'https://apps.apple.com/app/id6766147060';

      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      var storeUrl = isIOS ? APP_STORE : PLAY_STORE;
      var storeBtnText = isIOS ? 'App Store에서 받기' : 'Play 스토어에서 받기';

      document.getElementById('banner-btn').href = storeUrl;
      document.getElementById('banner-btn').textContent = storeBtnText;
      document.getElementById('cta-btn').href = storeUrl;
      document.getElementById('cta-btn').textContent = storeBtnText;

      var token = location.pathname.replace(/^\/share\//, '').replace(/\/$/, '');
      if (!token || !/^[a-f0-9]{32}$/.test(token)) {
        showError('잘못된 링크입니다', '올바른 공유 링크 주소인지 확인해 주세요.');
        return;
      }

      fetch('/api/share/' + token)
        .then(function (res) {
          if (res.status === 404) { return Promise.reject({ code: 404 }); }
          if (res.status === 403) { return Promise.reject({ code: 403 }); }
          if (!res.ok) { return Promise.reject({ code: res.status }); }
          return res.json();
        })
        .then(function (json) { return json.data || json; })
        .then(renderTrip)
        .catch(function (err) {
          if (err && err.code === 404) {
            showError('링크를 찾을 수 없습니다', '공유 링크가 만료되었거나 삭제되었습니다.');
          } else if (err && err.code === 403) {
            showError('만료된 링크입니다', '이 공유 링크의 유효 기간이 지났습니다.');
          } else {
            showError('불러오기 실패', '잠시 후 다시 시도해 주세요.');
          }
        });

      function renderTrip(trip) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('trip-content').style.display = 'block';
        document.getElementById('bottom-cta').style.display = 'flex';

        document.title = (trip.destination || '여행') + ' — myTravel';

        setText('trip-destination', trip.destination);
        setText('trip-country', trip.country);
        setText('trip-dates', formatDate(trip.startDate) + ' — ' + formatDate(trip.endDate));

        var itineraries = Array.isArray(trip.itineraries) ? trip.itineraries : [];
        var totalDays = itineraries.length;
        var totalActivities = itineraries.reduce(function (s, d) {
          return s + (Array.isArray(d.activities) ? d.activities.length : 0);
        }, 0);

        var statsEl = document.getElementById('trip-stats');
        statsEl.appendChild(makeStat(String(totalDays), '일'));
        statsEl.appendChild(makeStat(String(totalActivities), '활동'));
        if (trip.numberOfTravelers) {
          statsEl.appendChild(makeStat(String(trip.numberOfTravelers), '여행자'));
        }

        if (trip.description) {
          document.getElementById('description-section').style.display = 'block';
          setText('trip-description', trip.description);
        }

        if (itineraries.length > 0) {
          document.getElementById('itinerary-section').style.display = 'block';
          var sorted = itineraries.slice().sort(function (a, b) { return a.dayNumber - b.dayNumber; });
          var listEl = document.getElementById('itinerary-list');
          sorted.forEach(function (day) {
            listEl.appendChild(makeDayCard(day));
          });
        }
      }

      function makeStat(value, label) {
        var el = document.createElement('div');
        el.className = 'stat';
        var val = document.createElement('div');
        val.className = 'stat-value';
        val.textContent = value;
        var lbl = document.createElement('div');
        lbl.className = 'stat-label';
        lbl.textContent = label;
        el.appendChild(val);
        el.appendChild(lbl);
        return el;
      }

      function makeDayCard(day) {
        var card = document.createElement('div');
        card.className = 'day-card';

        var header = document.createElement('div');
        header.className = 'day-header';

        var title = document.createElement('span');
        title.className = 'day-title';
        title.textContent = 'Day ' + day.dayNumber;

        var dateEl = document.createElement('span');
        dateEl.className = 'day-date';
        dateEl.textContent = formatDate(day.date);

        header.appendChild(title);
        header.appendChild(dateEl);
        card.appendChild(header);

        var activities = Array.isArray(day.activities) ? day.activities : [];
        if (activities.length === 0) {
          var empty = document.createElement('div');
          empty.className = 'no-activities';
          empty.textContent = '등록된 활동이 없습니다.';
          card.appendChild(empty);
        } else {
          activities.forEach(function (act) {
            card.appendChild(makeActivityItem(act));
          });
        }

        return card;
      }

      function makeActivityItem(act) {
        var item = document.createElement('div');
        item.className = 'activity-item';

        var dot = document.createElement('div');
        dot.className = 'activity-dot';
        item.appendChild(dot);

        var content = document.createElement('div');

        var timeEl = document.createElement('div');
        timeEl.className = 'activity-time';
        timeEl.textContent = act.time || '';
        content.appendChild(timeEl);

        var titleEl = document.createElement('div');
        titleEl.className = 'activity-title';
        titleEl.textContent = act.title || '';
        content.appendChild(titleEl);

        if (act.location) {
          var locEl = document.createElement('div');
          locEl.className = 'activity-location';

          var pin = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          pin.setAttribute('width', '12');
          pin.setAttribute('height', '12');
          pin.setAttribute('viewBox', '0 0 24 24');
          pin.setAttribute('fill', 'none');
          pin.setAttribute('stroke', 'currentColor');
          pin.setAttribute('stroke-width', '2');
          pin.setAttribute('aria-hidden', 'true');
          var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', 'M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z');
          var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', '12');
          circle.setAttribute('cy', '10');
          circle.setAttribute('r', '3');
          pin.appendChild(path);
          pin.appendChild(circle);
          locEl.appendChild(pin);

          var locText = document.createElement('span');
          locText.textContent = act.location;
          locEl.appendChild(locText);

          content.appendChild(locEl);
        }

        item.appendChild(content);
        return item;
      }

      function showError(title, msg) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('error-title').textContent = title;
        document.getElementById('error-msg').textContent = msg;
      }

      function setText(id, value) {
        var el = document.getElementById(id);
        if (el) { el.textContent = value || ''; }
      }

      function formatDate(str) {
        if (!str) { return ''; }
        var d = new Date(str);
        return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
      }
    })();
  </script>
</body>
</html>
